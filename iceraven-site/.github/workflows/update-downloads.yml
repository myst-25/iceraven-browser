name: Update Download Links

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours

jobs:
  update-downloads:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Get latest release info
        id: release
        uses: bruceadams/get-release@v3.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          owner: fork-maintainers
          repo: iceraven-browser
          tag: latest

      - name: Extract versions from release notes
        id: versions
        run: |
          # Get release notes
          RELEASE_NOTES="${{ steps.release.outputs.body }}"
          
          # Extract Iceraven version
          ICERAVEN_VERSION=$(echo "$RELEASE_NOTES" | grep -oP 'Iceraven: \K[0-9.]+' || echo "2.31.0")
          
          # Extract Fenix version
          FENIX_VERSION=$(echo "$RELEASE_NOTES" | grep -oP 'Fenix: \K[0-9.]+' || echo "138.0")
          
          # Set outputs
          echo "iceraven_version=$ICERAVEN_VERSION" >> $GITHUB_OUTPUT
          echo "fenix_version=$FENIX_VERSION" >> $GITHUB_OUTPUT

      - name: Update download links and versions
        run: |
          # Get the latest version from the release tag
          VERSION=$(echo "${{ steps.release.outputs.tag_name }}" | sed 's/v//')
          
          # Read the current index.html
          HTML=$(cat public/index.html)
          
          # Update version information
          HTML=$(echo "$HTML" | sed "s|<span>Iceraven: [0-9.]*</span>|<span>Iceraven: ${{ steps.versions.outputs.iceraven_version }}</span>|g")
          HTML=$(echo "$HTML" | sed "s|<span>Fenix: [0-9.]*</span>|<span>Fenix: ${{ steps.versions.outputs.fenix_version }}</span>|g")
          
          # Update download links for each architecture
          HTML=$(echo "$HTML" | sed "s|/downloads/iceraven-[0-9.]*-browser-arm64-v8a-forkRelease.apk|/downloads/iceraven-$VERSION-browser-arm64-v8a-forkRelease.apk|g")
          HTML=$(echo "$HTML" | sed "s|/downloads/iceraven-[0-9.]*-browser-armeabi-v7a-forkRelease.apk|/downloads/iceraven-$VERSION-browser-armeabi-v7a-forkRelease.apk|g")
          HTML=$(echo "$HTML" | sed "s|/downloads/iceraven-[0-9.]*-browser-x86_64-forkRelease.apk|/downloads/iceraven-$VERSION-browser-x86_64-forkRelease.apk|g")
          HTML=$(echo "$HTML" | sed "s|/downloads/iceraven-[0-9.]*-browser-x86-forkRelease.apk|/downloads/iceraven-$VERSION-browser-x86-forkRelease.apk|g")
          
          # Write back to file
          echo "$HTML" > public/index.html

      - name: Download APK files
        run: |
          VERSION=$(echo "${{ steps.release.outputs.tag_name }}" | sed 's/v//')
          mkdir -p public/downloads
          
          # Function to download APK with retry
          download_apk() {
            local url=$1
            local output=$2
            local max_retries=3
            local retry_count=0
            
            while [ $retry_count -lt $max_retries ]; do
              if curl -L "$url" -o "$output" -f; then
                echo "Successfully downloaded $output"
                return 0
              else
                retry_count=$((retry_count + 1))
                echo "Failed to download $output (attempt $retry_count/$max_retries)"
                sleep 5
              fi
            done
            
            echo "Failed to download $output after $max_retries attempts"
            return 1
          }
          
          # Download APK files for each architecture
          download_apk "https://github.com/fork-maintainers/iceraven-browser/releases/download/v$VERSION/iceraven-$VERSION-browser-arm64-v8a-forkRelease.apk" "public/downloads/iceraven-$VERSION-browser-arm64-v8a-forkRelease.apk"
          download_apk "https://github.com/fork-maintainers/iceraven-browser/releases/download/v$VERSION/iceraven-$VERSION-browser-armeabi-v7a-forkRelease.apk" "public/downloads/iceraven-$VERSION-browser-armeabi-v7a-forkRelease.apk"
          download_apk "https://github.com/fork-maintainers/iceraven-browser/releases/download/v$VERSION/iceraven-$VERSION-browser-x86_64-forkRelease.apk" "public/downloads/iceraven-$VERSION-browser-x86_64-forkRelease.apk"
          download_apk "https://github.com/fork-maintainers/iceraven-browser/releases/download/v$VERSION/iceraven-$VERSION-browser-x86-forkRelease.apk" "public/downloads/iceraven-$VERSION-browser-x86-forkRelease.apk"

      - name: Verify APK files
        run: |
          # Check if all APK files exist and have size
          for arch in arm64-v8a armeabi-v7a x86_64 x86; do
            file="public/downloads/iceraven-$VERSION-browser-$arch-forkRelease.apk"
            if [ ! -f "$file" ] || [ ! -s "$file" ]; then
              echo "Error: $file is missing or empty"
              exit 1
            fi
          done

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/index.html public/downloads/
          git commit -m "Update to version ${{ steps.release.outputs.tag_name }} (Iceraven: ${{ steps.versions.outputs.iceraven_version }}, Fenix: ${{ steps.versions.outputs.fenix_version }})" || exit 0
          git push 