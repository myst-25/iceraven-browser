name: Manual Release Info Update

on:
  workflow_dispatch:

permissions:
  contents: write  # Required to push changes back to the repository

jobs:
  update-release-info:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update_release_info script
        run: python .github/scripts/update_release_info.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md index.html docs/building-guide.html manifest.json
          git commit -m "Update version to latest Iceraven release" || echo "No changes to commit"
          git push
