# .github/workflows/manual_release_update.yml

name: Manual Release Info Update

on:
  workflow_dispatch:

jobs:
  update-release-info:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update_release_info script
        run: python .github/scripts/update_release_info.py
